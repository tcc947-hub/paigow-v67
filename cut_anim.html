<title>切牌摆法演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 测试：八叠牌（每叠 4 张）一叠一叠举起来，叠到中间那一叠上。
   牌桌是斜着看的 3D 桌面，牌的高低用 translateZ 真的叠起来；牌和牌的样子沿用牌九游戏里的黑色电木牌。 */
:root{
  --bg:#0b1a13; --felt:#15432f; --felt-edge:#082417; --gold:#e3b95d; --ink:#f4ecd8; --muted:#9fb7a8;
  --accent:#c4422f; --line:rgba(244,236,216,.22); color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4efe3; --felt:#15432f; --felt-edge:#082417; --gold:#e3b95d; --ink:#1d1a14; --muted:#5f5a4c;
    --accent:#a8321c; --line:rgba(0,0,0,.18); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f4efe3; --felt:#15432f; --felt-edge:#082417; --gold:#e3b95d; --ink:#1d1a14; --muted:#5f5a4c;
  --accent:#a8321c; --line:rgba(0,0,0,.18); color-scheme:light;
}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans SC",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.6;
  padding-block:14px 28px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1{font-size:22px;margin:4px 0 2px;font-family:"Noto Serif SC",serif;color:var(--gold);letter-spacing:.12em}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.scene{
  position:relative;height:380px;overflow:hidden;border-radius:22px;
  perspective:760px; perspective-origin:50% 18%;
  background:radial-gradient(ellipse at 50% 100%, #163e63 0%, #071426 55%, #030914 100%);
  border:2px solid #4a3516; box-shadow:inset 0 0 50px rgba(0,0,0,.5);
}
.board{
  position:absolute; left:0; top:0; width:360px; height:360px;
  transform-origin:50% 50%; transform-style:preserve-3d;
  transform:translate(-50%,-50%) rotateX(44deg) scale(.95);
  left:50%; top:50%;
}
.tile{
  position:absolute; left:0; top:0; box-sizing:border-box;
  width:40px; height:103px; border-radius:5px;
  background:linear-gradient(176deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 18%),#1b1b1b;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -2px 2px rgba(0,0,0,.6);
  color:var(--gold); font-weight:700; font-size:13px;
  display:flex; align-items:center; justify-content:center;
  transition:transform .7s cubic-bezier(.4,.1,.2,1);
  transform-style:preserve-3d;
}
.tile::after{
  /* 每张牌的侧边：一道很薄的牌边，让叠起来的牌看得出是一张张的 */
  content:""; position:absolute; left:0; right:0; bottom:-4px; height:4px;
  background:#2b2b2b; border-radius:0 0 4px 4px; transform:rotateX(-90deg); transform-origin:top;
}
/* 牌面：上下两半，各 3×3 的点，沿用游戏里的画法 */
.tile .half{position:absolute;left:0;right:0;height:50%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:4px;box-sizing:border-box}
.tile .half:first-child{top:0}
.tile .half:last-child{top:50%;border-top:1px solid #333}
.tile .half i{display:flex;align-items:center;justify-content:center}
.tile .half i.p::after{content:"";width:72%;height:72%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff 0%,#f7f7f5 45%,#d9d9d6 100%);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.tile .half i.p.r::after{background:radial-gradient(circle at 40% 35%,#e5524a 0%,#a8161f 50%,#5c0508 100%);box-shadow:0 1px 1px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.25)}
.tile.photo{background:none;padding:0;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 4px 0 #3a3a3a,0 6px 8px rgba(0,0,0,.5)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;border-radius:inherit;pointer-events:none;-webkit-user-drag:none}
.board{background:radial-gradient(ellipse at 50% 40%, #1f6a48, #0a2a1b 78%);border-radius:18px;box-shadow:0 0 70px rgba(60,200,140,.22)}
.trail{position:absolute;left:0;top:0;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(53,240,160,0),rgba(53,240,160,.95),rgba(53,240,160,0));box-shadow:0 0 16px rgba(53,240,160,.85);pointer-events:none}
.tile.hot{filter:drop-shadow(0 0 7px rgba(53,240,160,.95))}
.step{margin:12px 0 4px;color:var(--muted);font-size:13px}
.desc{margin:4px 0 8px;min-height:3em;font-size:16px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.controls button{
  appearance:none;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-size:15px;
  background:var(--gold);color:#2a1d05;cursor:pointer;font-weight:600;
}
.controls button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.controls button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}
/* 骰子区：3 颗骰子 + 环形座位（庄在最下面，逆时针 庄→1→2→3→5→6→7→8，没有 4 号） */
.dicebox{position:relative;height:250px;border-radius:18px;background:radial-gradient(ellipse at 50% 40%,#1f6a48,#0a2a1b 78%);margin-bottom:10px;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.ring{position:absolute;left:50%;top:40%;width:290px;height:140px;transform:translate(-50%,-50%)}
.seat{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:#0b2a1c;border:2px solid rgba(244,236,216,.35);color:#f4ecd8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:background .12s,box-shadow .12s}
.seat.banker{border-color:#e3b95d;color:#e3b95d}
.seat.hot{background:#35f0a0;color:#06261a;box-shadow:0 0 18px rgba(53,240,160,.95);border-color:#35f0a0}
.tray{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:170px;height:80px;perspective:420px;display:flex;gap:14px;justify-content:center;align-items:center}
.die{width:44px;height:44px;position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.die .face{position:absolute;left:0;top:0;width:44px;height:44px;background:#f7f5ee;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset -3px -3px 6px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;box-sizing:border-box}
.die .face i{display:block;width:7px;height:7px;border-radius:50%;align-self:center;justify-self:center;background:transparent}
.die .face i.on{background:radial-gradient(circle at 35% 30%,#ff6a5f,#a8161f 60%,#5c0508);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.die .f1{transform:translateZ(22px)}
.die .f2{transform:rotateY(90deg) translateZ(22px)}
.die .f3{transform:rotateX(90deg) translateZ(22px)}
.die .f4{transform:rotateX(-90deg) translateZ(22px)}
.die .f5{transform:rotateY(-90deg) translateZ(22px)}
.die .f6{transform:rotateY(180deg) translateZ(22px)}
.dice-msg{text-align:center;margin:6px 0 8px;font-size:15px;min-height:2.6em}
.dice-msg small{display:block;color:var(--muted);font-size:12px}
.dicebox button{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);appearance:none;border:0;border-radius:12px;padding:9px 18px;font:inherit;font-size:15px;background:#e3b95d;color:#2a1d05;font-weight:600;cursor:pointer}
.dicebox button:disabled{opacity:.5;cursor:default}


.styles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.styles button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.styles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:14px}
.legend li{margin:4px 0}
.foot{color:var(--muted);font-size:12px;margin-top:18px}
</style>

<h1>切牌摆法演示</h1>
<p class="sub">选一种切法，一步一步看 8 叠牌怎么推、怎么叠。牌面是游戏里的牌照片。</p>

<div class="styles" id="styles" role="group" aria-label="切法"></div>

<p class="dice-msg" id="diceMsg">掷骰子，决定从哪一位开始发牌<small>Roll the dice to decide where dealing starts</small></p>
<div class="dicebox" id="dicebox">
  <div class="ring" id="ring"></div>
  <div class="tray" id="tray">
    <div class="die" id="die0"></div><div class="die" id="die1"></div><div class="die" id="die2"></div>
  </div>
  <button id="roll" type="button">掷骰子 · Roll</button>
</div>

<div class="scene" id="scene"><div class="board" id="board"></div></div>

<p class="step" id="step"></p>
<p class="desc" id="desc"></p>

<div class="controls">
  <button id="prev" type="button" class="ghost">上一步</button>
  <button id="next" type="button">下一步</button>
  <button id="auto" type="button" class="ghost">自动播放</button>
  <button id="reset" type="button" class="ghost">回到原位</button>
  <button id="sound" type="button" class="ghost">声音：开</button>
</div>

<ol class="legend" id="legend"></ol>

<p class="foot">动作依据 RWS 和 Maryland 规则里的文字说明做的近似示意，不是附录图的原样。文字或图里没写清的地方已在说明里标注；请以规则附录图为准。</p>

const soundBtn=document.getElementById('sound');
const stylesBox=document.getElementById('styles');

const PIP_SRC=window.PIP_SRC;
const KEYS=Object.keys(PIP_SRC);
const trailEls=[];
for(let i=0;i<8;i++){ const e=document.createElement('div'); e.className='trail'; e.style.display='none'; board.appendChild(e); trailEls.push(e); }
const tiles=[];
for(let i=0;i<32;i++){
  const d=document.createElement('div');
  d.className='tile photo';
  const pic=document.createElement('img');
  pic.src=PIP_SRC[KEYS[i%KEYS.length]]; pic.alt=''; pic.draggable=false;
  d.append(pic); board.appendChild(d); tiles.push(d);
}

function baseState(){ const s={}; for(let i=0;i<8;i++) s[i]={x:i,y:0,n:4}; return s; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function computeTrails(prev,cur){
  const out=[];
  for(const k of Object.keys(cur)){
    const a=prev[k], b=cur[k];
    if(!a||!b||!a.n||!b.n||b.tile) continue;
    if(a.x!==b.x||a.y!==b.y) out.push({x1:a.x,x2:b.x,y:b.y});
  }
  return out;
}
function buildSteps(style){
  const out=[]; let s=baseState();
  // 每张牌的身份：8 叠，每叠 4 张，按牌墩里的顺序（从下到上）记住每一张是哪一张真牌
  const own={}; for(let k=0;k<8;k++) own[k]=[4*k,4*k+1,4*k+2,4*k+3];
  const snap=()=>{ const o={}; for(const k in own) if(own[k].length) o[k]=own[k].slice(); return o; };
  out.push({t:style.frames[0].t, s:clone(s), lift:null, own:snap()});
  for(let i=1;i<style.frames.length;i++){
    const f=style.frames[i];
    const prev=clone(s), prevOwn=snap();
    for(const k in f.g){ s[k]=Object.assign({x:0,y:0,n:0}, s[k]||{}, f.g[k]); }
    const keys=Object.keys(s);
    const pool=[];
    for(const k of keys){
      const pn=(prev[k]&&prev[k].n)||0, nn=(s[k].n)||0;
      if(!own[k]) own[k]=[];
      if(nn<pn) pool.push(...own[k].splice(nn, pn-nn));
    }
    for(const k of keys){
      const pn=(prev[k]&&prev[k].n)||0, nn=(s[k].n)||0;
      if(nn>pn) own[k]=(own[k]||[]).concat(pool.splice(0, nn-pn));
    }
    if(f.lift && f.lift.length) out.push({t:f.t+'（先举起）', s:clone(prev), lift:f.lift.map(String), own:prevOwn});
    out.push({t:f.t, s:clone(s), lift:null, trails:computeTrails(prev,s), own:snap()});
  }
  return out;
}

let st=STYLES[0], steps=buildSteps(st), si=0, iv=null, muted=false, AC=null;

function layout(step){
  const slot=Math.min(44,(BOARD-24)/8);
  const off=(BOARD-8*slot)/2;
  const lifted=new Set(step.lift||[]);
  const pl=[];
  for(const k of Object.keys(step.s)){
    const v=step.s[k];
    if(!v||!v.n) continue;
    const ids=(step.own&&step.own[k])||[];
    if(v.tile){ pl.push({id:ids[0],key:k,x:v.x,y:v.y,z:0,rot:v.rot||0}); continue; }
    for(let j=0;j<v.n;j++) pl.push({id:ids[j],key:k,x:v.x,y:v.y,z:j*T,rot:0});
  }
  const shown=new Set();
  pl.forEach(p=>{
    const d=tiles[p.id]; if(!d||p.id===undefined) return;
    shown.add(p.id);
    const x=off+p.x*slot+(slot-TW)/2;
    const rowTop=60+p.y*130;
    const z=p.z+(lifted.has(p.key)?LIFT:0);
    d.style.display='';
    d.style.transform=`translate3d(${x}px, ${rowTop}px, ${z}px) rotateZ(${p.rot}deg)`;
    d.style.zIndex=Math.round(z+1);
    d.classList.toggle('hot', lifted.has(p.key));
  });
  for(let i=0;i<32;i++) if(!shown.has(i)) tiles[i].style.display='none';
  const tr=step.trails||[];
  trailEls.forEach((el,i)=>{
    const t=tr[i];
    if(!t){ el.style.display='none'; return; }
    const c1=off+t.x1*slot+slot/2, c2=off+t.x2*slot+slot/2;
    const left=Math.min(c1,c2), w=Math.abs(c2-c1);
    if(w<1){ el.style.display='none'; return; }
    el.style.display='';
    el.style.width=w+'px';
    el.style.transform=`translate3d(${left}px, ${60+t.y*130+50}px, 1px)`;
  });
}

function draw(){
  const step=steps[si];
  layout(step);
  descEl.textContent=step.t;
  stepEl.textContent=`第 ${si+1} / ${steps.length} 步`;
  prevBtn.disabled=si===0;
  nextBtn.disabled=si>=steps.length-1;
  autoBtn.disabled=si>=steps.length-1 && !iv;
}
function setStyle(s){
  stopAuto(); st=s; steps=buildSteps(s); si=0;
  [...stylesBox.children].forEach(b=>b.setAttribute('aria-pressed', b.dataset.id===s.id?'true':'false'));
  legendEl.innerHTML=s.legend.map(x=>`<li>${x}</li>`).join('');
  draw();
}
function next(){ if(si<steps.length-1){ si++; draw(); if(steps[si].lift===null && si>0) clackSoon(); } }
function prev(){ if(si>0){ si--; draw(); } }
function stopAuto(){ if(iv){ clearInterval(iv); iv=null; autoBtn.textContent='自动播放'; } }
function autoPlay(){
  if(iv){ stopAuto(); return; }
  if(si>=steps.length-1){ si=0; draw(); }
  autoBtn.textContent='暂停';
  iv=setInterval(()=>{ if(si>=steps.length-1){ stopAuto(); draw(); return; } next(); if(si>=steps.length-1) stopAuto(); }, 1300);
}
function reset(){ stopAuto(); si=0; draw(); }

function audioCtx(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function clack(){
  if(muted) return;
  const c=audioCtx(); if(!c) return;
  const t=c.currentTime, len=Math.floor(c.sampleRate*0.04);
  const buf=c.createBuffer(1,len,c.sampleRate), data=buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; f.Q.value=1.2;
  const g=c.createGain(); g.gain.value=0.5;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
}
function clackSoon(){ setTimeout(clack, 600); }

STYLES.forEach(s=>{
  const b=document.createElement('button');
  b.type='button'; b.dataset.id=s.id; b.textContent=s.zh; b.title=s.en;
  b.addEventListener('click',()=>setStyle(s));
  stylesBox.appendChild(b);
});
prevBtn.addEventListener('click',prev);
nextBtn.addEventListener('click',next);
autoBtn.addEventListener('click',autoPlay);
resetBtn.addEventListener('click',reset);
soundBtn.addEventListener('click',()=>{ muted=!muted; soundBtn.textContent=muted?'声音：关':'声音：开'; if(!muted) audioCtx(); });
window.addEventListener('resize',draw);
setStyle(STYLES[0]);


/* ===== 骰子：3 颗骰子，点数决定开始发牌的位置 ===== */
(function(){
  const ORDER=[{zh:'庄',en:'Banker'},{zh:'1'},{zh:'2'},{zh:'3'},{zh:'5'},{zh:'6'},{zh:'7'},{zh:'8'}];
  const ring=document.getElementById('ring'), rollBtn=document.getElementById('roll'), msg=document.getElementById('diceMsg');
  const dice=[0,1,2].map(i=>document.getElementById('die'+i));
  const seatEls=ORDER.map((o,i)=>{
    const el=document.createElement('div'); el.className='seat'+(i===0?' banker':'');
    el.textContent=o.zh;
    const th=(-90+45*i)*Math.PI/180;           // 庄在最下面，逆时针一位一位
    el.style.left=(50+50*Math.cos(th))+'%';
    el.style.top=(50-50*Math.sin(th))+'%';
    ring.appendChild(el); return el;
  });
  const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const FACE_ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
  dice.forEach(d=>{
    for(let f=1;f<=6;f++){
      const face=document.createElement('div'); face.className='face f'+f;
      for(let c=0;c<9;c++){const i=document.createElement('i'); if(PIPS[f].includes(c))i.className='on'; face.appendChild(i);}
      d.appendChild(face);
    }
    d.style.transform='rotateX(0deg) rotateY(0deg)';
  });
  let busy=false, timers=[];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function clearTimers(){timers.forEach(clearTimeout);timers=[];}
  function later(fn,ms){timers.push(setTimeout(fn,ms));}
  function setHot(i){seatEls.forEach((e,j)=>e.classList.toggle('hot',j===i));}
  rollBtn.addEventListener('click',()=>{
    if(busy)return;
    busy=true; rollBtn.disabled=true; clearTimers(); setHot(-1);
    msg.innerHTML='掷骰中…<small>Rolling…</small>';
    const faces=[1,2,3].map(()=>1+Math.floor(Math.random()*6));
    // 摇晃：多次乱转，最后停在随机的点数上
    dice.forEach((d,i)=>{
      const [rx,ry]=FACE_ROT[faces[i]];
      const sx=360*(2+Math.floor(rnd(0,3))), sy=360*(2+Math.floor(rnd(0,3)));
      d.style.transition='transform 1.1s cubic-bezier(.2,.7,.2,1)';
      d.style.transform=`rotateX(${rx+sx}deg) rotateY(${ry+sy}deg)`;
    });
    // 骰子在碗里撞击的声音（随机时间，像摇骰子）
    for(let i=0;i<16;i++) later(clack, rnd(0,1100));
    later(()=>{clack();clack();},1150);
    later(()=>{clack();},1260);
    later(()=>{
      const total=faces[0]+faces[1]+faces[2];
      const pos=(total-1)%8;                          // 庄算第 1 位，逆时针数到点数
      const where=pos===0?'庄家':`${ORDER[pos].zh} 号位`, whereEn=pos===0?'the banker':`seat ${ORDER[pos].zh}`;
      msg.innerHTML=`点数 ${total}：从庄家开始逆时针数 ${total} 位，停在 ${where}，第一叠发到这里。<small>Total ${total}: count ${total} places counter-clockwise from the banker, stop at ${whereEn}; the first stack goes there.</small>`;
      // 逐位数：从庄开始，逆时针每位停一下
      for(let k=0;k<total;k++){
        later(()=>{setHot(k%8); clack();}, 250+k*170);
      }
      later(()=>{setHot(pos);busy=false;rollBtn.disabled=false;rollBtn.textContent='再掷一次 · Roll again';}, 300+total*170);
    },1400);
  });
})();

/* 嵌入模式：游戏用 iframe 打开。游戏把真实的牌（8 叠）发过来，动画就用这些真牌 */
(function(){
  const q=new URLSearchParams(location.search);
  if(!q.get('embed'))return;
  document.body.classList.add('embed');
  document.documentElement.style.setProperty('background','transparent','important');
  document.body.style.setProperty('background','transparent','important');
  document.documentElement.style.setProperty('color-scheme','dark');
  const st0=document.createElement('style');
  st0.textContent='body.embed h1,body.embed .sub,body.embed .styles,body.embed .dice-msg,body.embed .dicebox,body.embed .controls,body.embed .legend,body.embed .foot,body.embed #desc,body.embed #step{display:none!important}body.embed{padding-top:0;background:transparent!important}body.embed .scene,body.embed .board,body.embed html{background:transparent!important;box-shadow:none!important;border:0!important}';
  document.head.appendChild(st0);
  const s=STYLES.find(x=>x.id===q.get('style'))||STYLES[0];
  setStyle(s);
  let started=false;
  const go=()=>{ if(started)return; started=true; if(!iv) autoPlay(); };
  window.addEventListener('message',e=>{
    const m=e.data;
    if(m&&m.type==='deck'&&Array.isArray(m.keys)){
      m.keys.forEach((k,i)=>{ const img=tiles[i]&&tiles[i].querySelector('img'); if(img&&PIP_SRC[k]) img.src=PIP_SRC[k]; });
      draw(); go();
    }
  });
  setTimeout(go,1500);
  try{parent.postMessage({type:'ready'},'*');}catch(e){}
  const check=setInterval(()=>{
    if(si>=steps.length-1){ clearInterval(check); setTimeout(()=>{ try{parent.postMessage({type:'cutDone',style:s.id,own:steps[steps.length-1].own},'*');}catch(e){} },900); }
  },300);
})();
